<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Himalayan Bites | Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f1e9;
      color: #29251f;
    }

    header {
      background: #8b3f25;
      color: white;
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 6px 0 0;
      color: #f5e3d9;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 14px;

    #logoutBtn {
      background: white;

      display: flex;

      margin: 0;

      background: #8b3f25;

</head>

<body>
  <header>
    <div>
      <h1>Himalayan Bites</h1>
      <p>Restaurant Admin Dashboard</p>
    </div>

    <button id="logoutBtn" type="button">Log Out</button>
  </header>

  <main>
    <section class="summary">
      <article class="card">
        <p>Total Orders</p>
        <h2 id="totalOrders">0</h2>
      </article>

      <article class="card">
        <p>Pending Orders</p>
        <h2 id="pendingOrders">0</h2>
      </article>

      <article class="card">
        <p>Preparing Orders</p>
        <h2 id="preparingOrders">0</h2>
      </article>

      <article class="card">
        <p>Completed Orders</p>
        <h2 id="completedOrders">0</h2>
      </article>
    </section>

    <section class="orders-panel">
      <div class="orders-heading">
        <h2>Customer Orders</h2>
        <button id="refreshBtn" type="button">Refresh Orders</button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Total</th>
              <th>Status</th>
              <th>Update Status</th>
            </tr>
          </thead>

          <tbody id="ordersTable">
            <tr>
              <td colspan="5" class="empty">Loading orders...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <p id="message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const allowedStatuses = [
      "pending",
      "accepted",
      "preparing",
      "ready",
      "out_for_delivery",
      "delivered",
      "cancelled"
    ];

    const ordersTable = document.getElementById("ordersTable");
    const message = document.getElementById("message");

    let orders = [];

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function formatMoney(value) {
      const amount = Number(value);

      if (!Number.isFinite(amount)) {
        return escapeHTML(value);
      }

      return "₹" + amount.toFixed(2);
    }

    function updateSummary() {
      document.getElementById("totalOrders").textContent = orders.length;

      document.getElementById("pendingOrders").textContent =
        orders.filter(order => order.status === "pending").length;

      document.getElementById("preparingOrders").textContent =
        orders.filter(order => order.status === "preparing").length;

      document.getElementById("completedOrders").textContent =
        orders.filter(order => order.status === "delivered").length;
    }

    function renderOrders() {
      updateSummary();

      if (orders.length === 0) {
        ordersTable.innerHTML = `
          <tr>
            <td colspan="5" class="empty">No orders found.</td>
          </tr>
        `;
        return;
      }

      ordersTable.innerHTML = orders.map(order => {
        const customer =
          order.customer_name ??
          order.name ??
          order.customerName ??
          "Customer";

        const total =
          order.total_amount ??
          order.total ??
          order.totalAmount ??
          0;

        const status = allowedStatuses.includes(order.status)
          ? order.status
          : "pending";

        return `
          <tr>
            <td>#${escapeHTML(order.id)}</td>
            <td>${escapeHTML(customer)}</td>
            <td>${formatMoney(total)}</td>
            <td>${escapeHTML(status.replaceAll("_", " "))}</td>
            <td class="status-cell">
              <select
                id="status-${escapeHTML(order.id)}"
                aria-label="Status for order ${escapeHTML(order.id)}"
              >
                ${allowedStatuses.map(option => `
                  <option value="${option}" ${option === status ? "selected" : ""}>
                    ${option.replaceAll("_", " ")}
                  </option>
                `).join("")}
              </select>

              <button
                type="button"
                data-order-id="${escapeHTML(order.id)}"
              >
                Save Status
              </button>
            </td>
          </tr>
        `;
      }).join("");
    }

    async function loadOrders() {
      message.textContent = "Loading orders...";

      try {
        const response = await fetch("/api/orders", {
          credentials: "same-origin",
          cache: "no-store"
        });

        if (response.status === 401) {
          window.location.replace("/admin/login");
          return;
        }

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Unable to load orders.");
        }

        // Support either an array or an object containing an orders array.
        orders = Array.isArray(data)
          ? data
          : Array.isArray(data.orders)
            ? data.orders
            : [];

        renderOrders();
        message.textContent = "Orders loaded successfully.";
      } catch (error) {
        message.textContent = error.message;
      }
    }

    async function updateOrderStatus(orderId) {
      const select = document.getElementById(`status-${orderId}`);

      if (!select || !allowedStatuses.includes(select.value)) {
        message.textContent = "Please select a valid order status.";
        return;
      }

      message.textContent = `Updating order #${orderId}...`;

      try {
        const response = await fetch(`/api/orders/${encodeURIComponent(orderId)}/status`, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "same-origin",
          body: JSON.stringify({
            status: select.value
          })
        });

        if (response.status === 401) {
          window.location.replace("/admin/login");
          return;
        }

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Unable to update order.");
        }

        message.textContent = `Order #${orderId} status updated.`;
        await loadOrders();
      } catch (error) {
        message.textContent = error.message;
      }
    }

    ordersTable.addEventListener("click", event => {
      const button = event.target.closest("button[data-order-id]");

      if (button) {
        updateOrderStatus(button.dataset.orderId);
      }
    });

    document.getElementById("refreshBtn").addEventListener("click", loadOrders);

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      message.textContent = "Logging out...";

      try {
        const response = await fetch("/api/admin/logout", {
          method: "POST",
          credentials: "same-origin"
        });

        if (response.ok) {
          window.location.replace("/admin/login");
        } else {
          message.textContent = "Unable to log out. Please try again.";
        }
      } catch (error) {
        message.textContent = "Connection error. Please try again.";
      }
    });

    loadOrders();
  </script>
</body>
</html>
